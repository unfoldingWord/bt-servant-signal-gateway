name: Deploy Production

# Production is manual (workflow_dispatch). Unlike a CF Worker, this is an always-on
# stateful Machine, so we don't auto-deploy prod on every merge.
#
# Branching model: production only ever runs a release, i.e. a v* tag cut on main after a
# develop → main (or hotfix/*) merge. Dispatch it on the tag:
#   gh workflow run deploy.yml --ref v<version>
# Two guards run before anything is deployed: the tag must be a v* tag on main, and CI must
# be green on that commit (the "never deploy red" guarantee).
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the guard below can check the tag is on main.
          fetch-depth: 0

      # workflow_dispatch accepts any ref, so refuse a branch, or a tag that never
      # reached main, before anything is deployed.
      - name: Require a release tag on main
        run: |
          set -euo pipefail
          echo "Dispatched on $GITHUB_REF ($GITHUB_SHA)"
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::Production deploys only from a v* release tag. Re-run with: gh workflow run deploy.yml --ref v<version>"
              exit 1 ;;
          esac
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} points at $GITHUB_SHA, which is not on main. Tag the release commit on main."
            exit 1
          fi
          echo "ok: ${GITHUB_REF#refs/tags/} is on main"

      - name: Require CI green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.sha }}"
          conclusion=$(gh run list --workflow ci.yml --branch main --limit 50 \
            --json headSha,status,conclusion \
            --jq 'map(select(.headSha=="'"$sha"'" and .status=="completed")) | .[0].conclusion // "none"')
          echo "CI conclusion for $sha: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI is not green for $sha (got '$conclusion'). Refusing to deploy."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5

      - name: Deploy to production
        run: flyctl deploy --remote-only --app bt-servant-signal-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
